[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-chain"
version = "0.1.0"
description = "An append-only, hash-chained evidence log in one SQLite file. Tamper-evident, fork-proof, no dependencies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yuliia Kulykivska" }]
requires-python = ">=3.11"
keywords = ["audit-log", "append-only", "hash-chain", "tamper-evident", "sqlite", "provenance", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Security",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
evidence-chain = "evidence_chain.cli:main"

[project.urls]
Homepage = "https://github.com/kulykivska/evidence-chain"
Issues = "https://github.com/kulykivska/evidence-chain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_chain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "PLC0415"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
